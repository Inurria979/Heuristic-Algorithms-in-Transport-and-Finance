[project]
name = "vrp"
version = "0.1.0"
description = "Heuristics for the Capacitated Vehicle Routing Problem on the Augerat/Christofides benchmark instances"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
